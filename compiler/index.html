<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatScript Compiler</title>
    <link rel="icon" type="image/png" href="icon.png">
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        h1 {
            color: #5b92e5;
            margin-top: 0;
            border-bottom: 2px solid #21262d;
            padding-bottom: 10px;
        }
        .container {
            display: flex;
            flex: 1;
            gap: 20px;
            min-height: 0;
        }
        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        textarea, .output {
            flex: 1;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 15px;
            color: #e6edf3;
            font-size: 16px;
            resize: none;
            outline: none;
        }
        textarea:focus {
            border-color: #5b92e5;
        }
        .output {
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-self: flex-start;
        }
        button {
            background-color: #238636;
            color: white;
            border: 1px solid rgba(240,246,252,0.1);
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #2ea043;
        }
        .secondary-btn {
            background-color: #21262d;
            border-color: #30363d;
        }
        .secondary-btn:hover {
            background-color: #30363d;
        }
        @keyframes customShine {
            0% { text-shadow: -10px 0 5px rgba(255,255,255,0), 0 0 4px currentColor; }
            50% { text-shadow: 0 0 10px #ffffff, 2px 0 15px currentColor, -2px 0 15px #ffffff; }
            100% { text-shadow: 10px 0 5px rgba(255,255,255,0), 0 0 4px currentColor; }
        }
        @keyframes customRainbow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        @keyframes customShake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0, 0); }
        }
    </style>
</head>
<body>

    <h1>MatScript (.mats) Compiler & Console</h1>
    
    <div class="btn-group">
        <button id="runBtn">Run Code</button>
        <button id="exportBtn" class="secondary-btn">Export Code</button>
        <button id="importBtn" class="secondary-btn">Import Code</button>
    </div>
    <input type="file" id="fileInput" accept=".mats" style="display: none;">

    <div class="container">
        <div class="panel">
            <h3>Input (.mats)</h3>
            <textarea id="editor" placeholder="Say('\red\\glow\\shiny\Hey!!!')"></textarea>
        </div>
        <div class="panel">
            <h3>Log Output</h3>
            <div id="console" class="output"></div>
        </div>
    </div>

    <script type="module">
        import { RUN } from './compiler.js';

        document.getElementById('runBtn').addEventListener('click', () => {
            const consoleOut = document.getElementById('console');
            const matsCode = document.getElementById('editor').value;
            consoleOut.innerHTML = "";

            if (typeof RUN === 'function') {
                RUN(matsCode);
            } else {
                consoleOut.innerText = "Error: RUN function is not available.";
            }
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
            const matsCode = document.getElementById('editor').value;
            const blob = new Blob([matsCode], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'program.mats';
            a.click();
            URL.revokeObjectURL(url);
        });

        document.getElementById('importBtn').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });

        document.getElementById('fileInput').addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('editor').value = e.target.result;
            };
            reader.readAsText(file);
        });
    </script>

</body>
</html>
