<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatScript Compiler</title>
    <link rel="icon" type="image/png" href="icon.png">
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        h1 {
            color: #5b92e5;
            margin-top: 0;
            border-bottom: 2px solid #21262d;
            padding-bottom: 10px;
        }
        .container {
            display: flex;
            flex: 1;
            gap: 20px;
            min-height: 0;
        }
        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        textarea, .output {
            flex: 1;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 15px;
            color: #e6edf3;
            font-size: 16px;
            resize: none;
            outline: none;
        }
        textarea:focus {
            border-color: #5b92e5;
        }
        .output {
            overflow-y: auto;
            white-space: pre-wrap;
        }
        button {
            background-color: #238636;
            color: white;
            border: 1px solid rgba(240,246,252,0.1);
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            align-self: flex-start;
        }
        button:hover {
            background-color: #2ea043;
        }
        .glow-red {
            color: #ff453a !important;
            text-shadow: 0 0 8px #ff453a, 0 0 15px #ff453a;
            font-weight: bold;
        }
        @keyframes shine {
            to { background-position: 200% center; }
        }
    </style>
</head>
<body>

    <h1>MatScript (.mats) Compiler & Console</h1>
    
    <button id="runBtn" onclick="runMatScript()">Run Code</button>

    <div class="container">
        <div class="panel">
            <h3>Input (.mats)</h3>
            <textarea id="editor" placeholder="locvardef test 'hello world'&#10;Say(localvar.test)"></textarea>
        </div>
        <div class="panel">
            <h3>Log Output</h3>
            <div id="console" class="output"></div>
        </div>
    </div>

    <script src="compiler.js"></script>

    <script>
        function runMatScript() {
            const consoleOut = document.getElementById('console');
            const matsCode = document.getElementById('editor').value;
            consoleOut.innerHTML = "";

            if (typeof RUN === 'function') {
                RUN(matsCode);
            } else {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'glow-red';
                errorDiv.innerText = "\\glow\\\\red\\Error: compiler.js file or RUN function not found.";
                consoleOut.appendChild(errorDiv);
            }
        }
    </script>

</body>
</html>
